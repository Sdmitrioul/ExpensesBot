databaseChangeLog:
  - changeSet:
      id: create-table-group-participants
      author: dskroba
      changes:
        - createTable:
            tableName: group_participants
            columns:
              - column:
                  name: group_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: principal_id
                  type: bigint
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: group_participants
            columnNames: group_id, principal_id
            constraintName: pk_group_participants