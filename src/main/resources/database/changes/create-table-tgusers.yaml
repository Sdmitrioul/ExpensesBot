databaseChangeLog:
  - changeSet:
      id: create-table-tg_users
      author: dskroba
      changes:
        - createTable:
            tableName: tg_users
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false

