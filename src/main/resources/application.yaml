server:
  port: ${APP_PORT:8080}

spring:
  security:
    user:
      name: ${APP_USER}
      password: ${APP_PASSWORD}

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
    token: ${TELEGRAM_BOT_TOKEN}
    allowed-users: ${TELEGRAM_ALLOWED_USERS}
    threads-count: ${TELEGRAM_THREADS_COUNT:2}

application:
  time-zone: ${APPLICATION_TIME_ZONE:UTC}
  google:
    application-name: ${GOOGLE_APPLICATION_NAME:SPEND_TRACKER}
    token-storage-path: ${GOOGLE_TOKEN_STORAGE:./data/token/}
    credentials-file: ${GOOGLE_CREDENTIALS_FILE:./data/secret/credentials.json}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
  database:
    principals: ${DATABASE_NAME_PRINCIPAL}
    principal-states: ${DATABASE_NAME_PRINCIPAL_STATE}
    path: ${DATABASE_PATH}

logging:
  level:
    com.dskroba: INFO
    root: INFO